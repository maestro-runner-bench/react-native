name: maestro-runner iOS debug

# Runs RNTester's iOS flows in batch mode with maestro-runner on the iOS app
# a previous Test All run built, and keeps every log needed to debug the
# runner: our reports, the agent's launch log and state, the simulator log,
# and stack samples of the agent process when it stops answering.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Test All run whose RNTester iOS app to use
        default: '36917315070'
      flavor:
        description: Release or Debug
        default: Release
      mr_version:
        description: maestro-runner version to install
        default: '1.1.28.1'
      flow:
        description: A flow file or folder to run
        default: ./packages/rn-tester/.maestro/

permissions:
  contents: read
  actions: read

jobs:
  ios-debug:
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      DEBUG_DIR: /tmp/mr-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Download the CI-built RNTester app
        uses: actions/download-artifact@v7
        with:
          name: RNTesterApp-NewArch-${{ inputs.flavor }}
          path: /tmp/RNTesterBuild/RNTester.app
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Install maestro-runner
        run: |
          curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version ${{ inputs.mr_version }}
          $HOME/.maestro-runner/bin/maestro-runner --version
          mkdir -p "$DEBUG_DIR"
      - name: Install node dependencies (Debug, for Metro)
        if: ${{ inputs.flavor == 'Debug' }}
        uses: ./.github/actions/yarn-install
      - name: Start Metro (Debug)
        if: ${{ inputs.flavor == 'Debug' }}
        run: |
          ./packages/react-native-codegen/scripts/oss/build.sh
          yarn start &
          sleep 5
      - name: Boot the simulator and install the app (timed)
        timeout-minutes: 30
        run: |
          set +e
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]||[]; const s=d.find(x=>x.name==="iPhone 17 Pro"); process.stdout.write(s?s.udid:"")')
          echo "simulator: $UDID" | tee "$DEBUG_DIR/boot.txt"
          [ -n "$UDID" ] || { xcrun simctl list devices available | tee -a "$DEBUG_DIR/boot.txt"; exit 1; }
          s=$(date +%s); xcrun simctl boot "$UDID" 2>&1 | tee -a "$DEBUG_DIR/boot.txt"
          echo "boot command: $(( $(date +%s)-s ))s" | tee -a "$DEBUG_DIR/boot.txt"
          s=$(date +%s); t 900 xcrun simctl bootstatus "$UDID" -b > "$DEBUG_DIR/bootstatus.txt" 2>&1; rc=$?
          echo "bootstatus rc=$rc after $(( $(date +%s)-s ))s" | tee -a "$DEBUG_DIR/boot.txt"
          s=$(date +%s); t 600 xcrun simctl install "$UDID" /tmp/RNTesterBuild/RNTester.app 2>&1 | tee -a "$DEBUG_DIR/boot.txt"; rc2=${PIPESTATUS[0]}
          echo "install rc=$rc2 after $(( $(date +%s)-s ))s" | tee -a "$DEBUG_DIR/boot.txt"
          xcrun simctl list devices booted | tee -a "$DEBUG_DIR/boot.txt"
          if [ $rc != 0 ] || [ $rc2 != 0 ]; then
            ps -axo pid,etime,%cpu,command | grep -iE "simulator|simctl|launchd_sim|CoreSimulator" | grep -v grep > "$DEBUG_DIR/boot-processes.txt"
            exit 1
          fi
      - name: Watchdog - sample the agent when it stops answering
        run: |
          # Every 20s: once a runner log reports "did not answer", take up to
          # 5 stack samples of the agent process and a simulator screenshot.
          nohup bash -c '
            n=0
            while [ $n -lt 5 ]; do
              sleep 20
              if grep -qs "did not answer within" /tmp/MaestroRunner/attempt-*/maestro-runner.log /tmp/MaestroRunner/attempt-*/client.log 2>/dev/null; then
                n=$((n+1)); ts=$(date +%H%M%S)
                for pid in $(pgrep -f "DevicelabIOSAgent|devicelab-ios-agent|AgentUITests" ); do
                  sample $pid 3 -file "$DEBUG_DIR/sample-$n-$ts-$pid.txt" >/dev/null 2>&1
                  ps -o pid,stat,etime,command -p $pid >> "$DEBUG_DIR/sample-$n-$ts-ps.txt" 2>&1
                done
                xcrun simctl io booted screenshot "$DEBUG_DIR/screen-$n-$ts.png" >/dev/null 2>&1
                echo "sampled $n at $ts" >> "$DEBUG_DIR/watchdog.log"
                if [ $n -ge 3 ]; then
                  # Enough evidence: end the run so the logs are collected.
                  echo "stopping the run after $n samples" >> "$DEBUG_DIR/watchdog.log"
                  pkill -f "maestro-runner/bin/maestro-runner" ; pkill -f "workflow-scripts/maestro-ios.js"
                  break
                fi
                sleep 40
              fi
            done' > "$DEBUG_DIR/watchdog.out" 2>&1 &
      - name: Run RNTester flows (batch)
        timeout-minutes: 75
        run: |
          set +e
          node .github/workflow-scripts/maestro-ios.js \
            /tmp/RNTesterBuild/RNTester.app \
            com.meta.RNTester.localDevelopment \
            "${{ inputs.flow }}" \
            Hermes \
            "${{ inputs.flavor }}" \
            . \
            iPhone-17-Pro \
            iOS-26-2
          echo "exit=$?"
      - name: Collect logs (quick)
        if: always()
        run: |
          set +e
          cp -R /tmp/MaestroRunner "$DEBUG_DIR/reports" 2>/dev/null
          cp -R $HOME/.maestro-runner/cache/devicelab-ios-agent "$DEBUG_DIR/agent-state" 2>/dev/null
          cp video_record_*.mov "$DEBUG_DIR/" 2>/dev/null
          xcrun simctl list devices > "$DEBUG_DIR/simulator.txt" 2>&1
          ls -la "$DEBUG_DIR"
      - name: Upload logs (quick)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-ios-debug-${{ inputs.flavor }}
          path: /tmp/mr-debug/
          if-no-files-found: warn
      - name: Collect the simulator log (bounded)
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          mkdir -p /tmp/mr-debug-simlog
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1)
          [ -n "$UDID" ] || exit 0
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl spawn $UDID log show --last 1h --style compact \
            --predicate 'process CONTAINS "Agent" OR process CONTAINS "RNTester" OR process == "SpringBoard" OR process == "testmanagerd" OR process CONTAINS "XCTRunner" OR subsystem CONTAINS "XCTest"' \
            > /tmp/mr-debug-simlog/simulator-log-filtered.txt 2>&1
          gzip -f /tmp/mr-debug-simlog/simulator-log-filtered.txt
          ls -la /tmp/mr-debug-simlog
      - name: Upload the simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-ios-debug-${{ inputs.flavor }}-simlog
          path: /tmp/mr-debug-simlog/
          if-no-files-found: warn
